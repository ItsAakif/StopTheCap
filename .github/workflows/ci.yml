name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # Deliberately minimal and pinned to what the data pipeline actually imports.
          # No torch / transformers here: this job does not train anything.
          pip install "numpy>=2.0" "pydantic>=2.7" "PyYAML>=6.0" "scikit-learn>=1.4" "pytest>=8.0" "Pillow>=10"

      - name: Verify imports
        run: python -c "import ml.cli, ml.ingest.pipeline, ml.audit.audit; print('imports ok')"

      - name: Unit tests
        run: python -m pytest -q

      - name: Manifest licence discipline
        run: python -m pytest -q tests/test_manifests.py -v

  guard:
    # Fails the build if restricted data or secrets are ever committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No raw dataset files committed
        run: |
          if [ -d datasets/raw ] && [ -n "$(find datasets/raw -type f -not -name '.gitkeep' 2>/dev/null)" ]; then
            echo "::error::dataset source files must not be committed (ADR-013)"; exit 1
          fi
          echo "ok: no raw data committed"

      - name: No credentials committed
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{16,}|hf_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)' -- \
               ':!*.md' ':!tests/*' ; then
            echo "::error::possible credential in committed file"; exit 1
          fi
          echo "ok: no credentials found"

      - name: No model checkpoints committed
        run: |
          if git ls-files | grep -E '\.(ckpt|pt|onnx|safetensors|bin)$' ; then
            echo "::error::model artefacts must not be committed"; exit 1
          fi
          echo "ok: no model artefacts"
